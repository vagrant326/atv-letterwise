name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The core module is Android-free on purpose, so the simulator and the shipped
      # IME cannot diverge. These tests are the only fast feedback that exists: there
      # is no device channel and no emulator.
      - name: Check
        run: ./gradlew --no-daemon check

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_number }}
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  # Deliberately separate and deliberately absent for now. The Android module does not
  # exist yet, and a job that swallows "task not found" would report green while
  # building nothing. Re-enable by deleting the `if: false` once :app lands.
  apk:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Assemble debug
        run: >
          ./gradlew --no-daemon assembleDebug
          -PversionCode=${{ github.run_number }}
          -PversionName=ci-${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
