name: CI

on:
  push:
    branches: [develop, 'feature/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      # The core module is Android-free on purpose, so the simulator and the shipped
      # IME cannot diverge. With no device channel and no emulator, these tests plus
      # lint are the entire safety net.
      - name: Check
        run: ./gradlew --no-daemon check

      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Assemble debug
        run: >
          ./gradlew --no-daemon assembleDebug
          -PversionCode=${{ github.run_number }}
          -PversionName=ci-${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
