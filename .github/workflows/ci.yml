name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The core module is Android-free on purpose, so the simulator and the shipped
      # IME cannot diverge. These tests are the only fast feedback that exists -
      # there is no device channel and no emulator.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      - name: Lint
        run: ./gradlew --no-daemon lint

      - name: Assemble debug
        run: ./gradlew --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PversionName=ci-${{ github.run_number }}

      # KSPC and the other metrics come out of the simulator on every build, so a
      # regression in the model shows up here rather than being noticed months later.
      - name: Benchmark
        run: ./gradlew --no-daemon :core:benchmark || echo "benchmark task not present yet"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.run_number }}
          path: bench/result.json
          if-no-files-found: ignore
