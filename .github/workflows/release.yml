name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to raise'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are the version source of truth, so the whole history is needed.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The next version comes from the highest existing tag, not from runner state.
      # github.run_number resets to 1 if this file is renamed or recreated, versionCode
      # would go backwards, and Android then refuses every later update with nothing
      # obvious to blame - unrecoverable without an uninstall when sideloading is the
      # only delivery channel.
      - name: Resolve next version
        id: v
        env:
          BUMP: ${{ github.event.inputs.bump || 'patch' }}
        run: |
          set -eu
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No release tags yet, starting from $LATEST"
          fi
          CURRENT="${LATEST#v}"
          MAJOR="${CURRENT%%.*}"; REST="${CURRENT#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::MINOR and PATCH must stay below 100 or versionCode stops increasing"
            exit 1
          fi
          NAME="$MAJOR.$MINOR.$PATCH"
          if git rev-parse "v$NAME" >/dev/null 2>&1; then
            echo "::error::Tag v$NAME already exists"
            exit 1
          fi
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "Releasing v$NAME (was $LATEST, bump=$BUMP)"

      - name: Check
        run: ./gradlew --no-daemon check

      - name: Lint
        run: ./gradlew --no-daemon lint

      # The keystore must never change. A different key means Android refuses to install
      # the update over the existing app, and the only way out is an uninstall, which
      # takes the user's settings with it.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/release-and-signing.md"
            exit 1
          fi
          # Strip whitespace before decoding: pasting into the secrets UI can introduce
          # line breaks, and base64 -d treats those as corruption.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle reports every one of these as "keystore password was incorrect", which
      # sends you looking in the wrong place. Separate them here, before Gradle runs.
      # The SHA-256 is safe to print - it is a hash, not the key - and it settles whether
      # the base64 survived the trip through the secrets UI.
      - name: Validate keystore and credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -u
          KS="$RUNNER_TEMP/release.jks"
          echo "decoded size: $(wc -c < "$KS") bytes"
          echo "sha256:       $(sha256sum "$KS" | cut -d' ' -f1)"
          echo "expected:     573d49d428d778a9e3ed61b31ca0f3ea8414a3cba11c6a434b89d1636f4d119b"

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" > /tmp/entries 2>/tmp/err; then
            echo "::error::Cannot open the keystore. KEYSTORE_PASSWORD is wrong, or the decoded file is not a keystore."
            sed -e "s/$KEYSTORE_PASSWORD/[redacted]/g" /tmp/err || true
            exit 1
          fi
          echo "keystore opened, entries:"
          grep -E '^[^ ].*,' /tmp/entries || true

          if ! grep -qi "^$KEY_ALIAS," /tmp/entries; then
            echo "::error::KEY_ALIAS is not an entry in this keystore. See the alias listed above."
            exit 1
          fi

          if ! keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>/tmp/err2; then
            echo "::error::KEY_PASSWORD is wrong for this alias. In PKCS12 it must equal KEYSTORE_PASSWORD."
            sed -e "s/$KEY_PASSWORD/[redacted]/g" /tmp/err2 || true
            exit 1
          fi
          echo "credentials verified"

      - name: Assemble release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.v.outputs.code }} \
            -PversionName=${{ steps.v.outputs.name }}

      # A misconfigured signing block falls back to the debug key in some Gradle setups,
      # and a debug-signed APK will not install over a release-signed one. Finding that
      # out on the TV costs a release cycle, so fail here instead.
      - name: Verify the APK is signed with the release key
        run: |
          set -eu
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No release APK produced"; exit 1; fi
          RENAMED="atv-letterwise-${{ steps.v.outputs.name }}.apk"
          mv "$APK" "$RENAMED"
          echo "APK=$RENAMED" >> "$GITHUB_ENV"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RENAMED"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "$APK" \
            --target "${{ github.sha }}" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
