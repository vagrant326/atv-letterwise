name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          NAME="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # versionName is the tag without the leading v, so the in-app update check can
          # compare it against the releases API without parsing anything.
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode is derived from the tag rather than from github.run_number.
          # run_number is per-workflow runner state: recreating or renaming this file
          # resets it to 1, versionCode goes backwards, and Android then refuses every
          # future update with no obvious cause. Sideloading is the only delivery channel
          # here, so that failure would be unrecoverable without an uninstall.
          MAJOR="${NAME%%.*}"; REST="${NAME#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::MINOR and PATCH must each stay below 100 for versionCode to keep increasing"
            exit 1
          fi
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew --no-daemon test

      # The keystore must stay the same forever. A new key means Android refuses to
      # install the update over the existing app, and the only recovery is uninstall,
      # which takes the user's settings with it.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. See docs/release-and-signing.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionCode=${{ steps.v.outputs.code }} \
            -PversionName=${{ steps.v.outputs.name }}

      - name: Verify the APK is actually signed with the release key
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "$APK" \
            --title "${{ steps.v.outputs.tag }}" \
            --generate-notes

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
